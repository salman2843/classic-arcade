# GitHub Pages builds this branch with Jekyll (the Actions workflow stages its
# own artifact, but the branch build is what GitHub serves today).
#
# Keep developer material off the public site. Only the files the games need are
# published: the HTML, src/, python/, manifest.json and the screenshot cards.
#
# Nothing here re-includes underscore-named files: the Python packages are
# namespace packages, so there are no __init__.py files to rescue from Jekyll.
exclude:
  - docs
  - screenshots
  - tests
  - tools
  - README.md
  - requirements-dev.txt
  - .github
  - .gitignore
  - .venv
